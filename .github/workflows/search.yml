name: FundedHive Search Automation

on:
  schedule:
    - cron: '0 */3 * * *' # Run every 3 hours
  workflow_dispatch:      # Allow manual trigger

permissions:
  contents: write

jobs:
  run-search:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-size: '3.11'
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install Chrome and ChromeDriver
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run search automation
      run: |
        # Run main.py which visits X post and runs searches
        python main.py

    - name: Prepare reports for GitHub Pages
      run: |
        # Copy the generated report to index.html for root hosting
        cp results/report.html results/index.html
        
    - name: Deploy to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: results
        branch: gh-pages
        clean: true
